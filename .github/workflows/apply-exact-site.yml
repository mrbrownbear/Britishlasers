name: Apply exact British Lasers capture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exact-site.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact captured site
        shell: bash
        run: |
          set -euo pipefail

          count=$(find .github -maxdepth 1 -type f -name 'exact-site-payload.part*' | wc -l)
          test "$count" -eq 13

          cat .github/exact-site-payload.part* | tr -d '\n\r ' | base64 -d > /tmp/exact-site.tar.gz
          gzip -t /tmp/exact-site.tar.gz
          tar -xzf /tmp/exact-site.tar.gz -C .

          grep -Fq 'Professional Hair Removal and Tattoo Removal' index.html
          grep -Fq 'Laser Machines for UK Clinics' index.html
          grep -Fq '48 working hrs' index.html

          printf '%s\n' '{"routes":[{"handle":"filesystem"},{"src":"/.*","dest":"/index.html"}]}' > vercel.json

          rm -f assets/brand-logo.svg
          rm -f assets/fallback.svg
          rm -f assets/favicon.svg
          rm -f assets/guide.svg
          rm -f assets/machine-erays.svg
          rm -f assets/machine-lite.svg
          rm -f assets/machine-plus.svg
          rm -f assets/machine-tatouage.svg
          rm -f assets/offline.js
          rm -f assets/recovery.css
          rm -f assets/service-icon.svg

          rm -f .github/final-site-payload.part*
          rm -f .github/exact-site-payload.part*
          rm -f .github/workflows/fetch-britishlasers-assets.yml
          rm -f .github/workflows/inspect-final-payload.yml
          rm -f .github/workflows/apply-exact-site.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Restore exact captured British Lasers site'
          git push
