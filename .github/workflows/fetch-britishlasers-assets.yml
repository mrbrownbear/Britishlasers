name: Apply exact captured British Lasers build
on:
  push:
    branches: [main]
    paths:
      - '.github/final-site-payload.part12'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact captured build
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-site-payload.part{00..12} | base64 -d > /tmp/site.tar.gz
          echo "de268126a1e1189c2c457a04690ebb1e25f637b19c5b0983e318314e005498fc  /tmp/site.tar.gz" | sha256sum -c -
          tar -xzf /tmp/site.tar.gz
          rm -f .github/final-site-payload.part{00..12}
          rm -f assets/brand-logo.svg assets/fallback.svg assets/favicon.svg assets/guide.svg
          rm -f assets/machine-erays.svg assets/machine-lite.svg assets/machine-plus.svg assets/machine-tatouage.svg
          rm -f assets/offline.js assets/recovery.css assets/service-icon.svg
          rm -f .github/workflows/fetch-britishlasers-assets.yml
      - name: Commit exact localized site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Restore exact British Lasers captured site [skip ci]'
          git push
